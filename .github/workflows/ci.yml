name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, fileinfo
          tools: composer:v2
          coverage: none

      - name: Install dependencies (composer.lock)
        run: composer install --no-dev --prefer-dist --no-progress

      - name: Sintassi
        run: |
          for f in qrcode-generator.php tests/*.php; do php -l "$f"; done

      - name: Generazione QR (senza e con logo)
        run: php tests/smoke-test.php
