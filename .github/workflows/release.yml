name: Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: gd, fileinfo
          tools: composer:v2
          coverage: none

      - name: Install dependencies (composer.lock)
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress

      # Font di endroid per le etichette sotto il QR (16 MB): il plugin non usa
      # etichette. Senza, lo ZIP passa da 13 MB a circa 1 MB.
      - name: Rimuovi font etichette (non usato)
        run: rm -f vendor/endroid/qr-code/assets/*.otf vendor/endroid/qr-code/assets/*.ttf

      - name: Smoke test
        run: php tests/smoke-test.php

      # La cartella nello ZIP deve chiamarsi come quella installata sui siti
      # (qrcode-generator), altrimenti WordPress installa un secondo plugin.
      - name: Create ZIP
        run: |
          mkdir -p build/qrcode-generator
          rsync -a ./ build/qrcode-generator/ \
            --exclude '.git' --exclude '.github' --exclude '.gitignore' \
            --exclude '.DS_Store' --exclude 'build' --exclude 'tests'
          cd build
          zip -qr "qrcode-generator-${GITHUB_REF_NAME}.zip" qrcode-generator
          unzip -l "qrcode-generator-${GITHUB_REF_NAME}.zip" | grep -q 'qrcode-generator/qrcode-generator.php'

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/qrcode-generator-${{ github.ref_name }}.zip
          generate_release_notes: true
